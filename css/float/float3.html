<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* box : 흰색 배경 */
      .box {
        background-color: white;
      }

      /* 왼쪽 화살표 : 왼쪽 */
      .box img:first-child {
        float: left;
      }
      .box img:nth-child(2) {
        float: right;
      }
      /* 오른쪽 화살표 : 오른쪽 */
      p {
        clear: both;
      }
      /* p영역은 원래대로 */
    </style>
  </head>
  <body>
    <div class="box">
      <img src="./data/left-arrow.png" alt="" />
      <img src="./data/right-arrow.png" alt="" />
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Inventore nihil ut rerum officia impedit molestiae,
        officiis natus consequatur, ipsam voluptates ducimus doloremque excepturi rem et harum! Excepturi repudiandae
        vitae amet.
      </p>
    </div>
  </body>
</html>
