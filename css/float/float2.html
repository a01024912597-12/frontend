<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 
        float 속성은 위로 뜨는 상태
        float 속성 지정하면 지정한 높이나 너비를 반영해 블록 요소처럼 동작
        clear : 방향; clear:left;, clear:right, clear:both; => float 속성 해제
        문제점 : 부모의 크기 문제가 생길 수 있음
            해결1 : clear 사용
            해결2 : 부모에 overflow: hidden 주기
            해결3 : 가상요소 

    -->
    <style>
      section {
        padding: 16px;
        background-color: lightgray;
        margin: 1em;
        padding: 1em;
        /* overflow: hidden; */
      }
      section::after {
        content: "";
        clear: both;
        display: block;
      }

      .blue,
      .red {
        height: 200px;
        line-height: 200px;
        font-size: 1.4em;
        text-align: center;
        color: white;
      }
      .blue {
        float: left;
        width: 200px;
        background-color: slateblue;
      }
      .red {
        float: left;
        width: calc(100% - 200px);
        background-color: tomato;
      }
      .empty {
        /* clear: both; */
      }
    </style>
  </head>
  <body>
    <section class="gray">
      <div class="blue">보라</div>
      <div class="red">빨강</div>
      <div class="empty"></div>
    </section>
  </body>
</html>
