<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Light</h1>
    <div>
      <button type="button">Turn on the light</button>
      <img src="/js/data/pic_bulboff.gif" alt="" />
      <button type="button">Turn off the light</button>
      <!-- <img src="/js/data/pic_bulbon.gif" alt="" /> -->
    </div>
    <script>
      // 이벤트 버블링 => 이벤트위임
      const div = document.querySelector("div");
      // img 찾기
      const img = document.querySelector("img");
      let mode = true;
      div.addEventListener("click", (e) => {
        if (e.target.textContent === "Turn on the light") {
          img.src = "./data/pic_bulbon.gif";
        } else {
          img.src = "./data/pic_bulboff.gif";
        }
      });
      // img.src = "변경값"
    </script>
  </body>
</html>
