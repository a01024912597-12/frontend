<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>본인 소개 페이지</title>
  </head>
  <body>
    <!--h1,p,ul,ol,li : 본인이름(h2)과 간단한 소개(p), 취미(ul), 좋아하는 음식(ol), 이메일(p) -->
    <h2 id="name" style="padding-top: px">이종혁</h2>
    <p>안녕하세요 01년생 이종혁 입니다</p>
    <p>취미</p>
    <ul>
      <li>게임</li>
      <li>디스코드</li>
      <li>취침</li>
    </ul>
    <p>좋아하는 음식</p>
    <ol>
      <li>삼겹살</li>
      <li>계란후라이</li>
      <li>소세지</li>
    </ol>
  </body>
</html>
