<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./data/favicon.ico" />
    <title>Document</title>
  </head>
  <body>
    <!-- 
    form 태그
        폼 태그 속성
        action: form 요소의 값들이 가야할 곳(경로)
        method: get(기본) or post

        1) input
           text : 한 줄짜리 text
           radio : 하나만 선택 시(필수로 value 속성 필요)
           checkbox: 여러개 선택 시(필수로 value 속성 필요)
           submit: form 요소의 값들을 action에 적힌 곳으로 전송
           button: 버튼 모양으로만 나옴 => 스크립트 필요

           date
           datetime-local
           email
           file
           color
           month
           number
           password
           search
           tel
           time
           url
           week

        input 요소에 사용할 수 있는 속성
        value, readonly, disabled, size, maxlength, min, max, multiple
        pattern(정규식), placeholder(힌트), required(무조건 입력값 요구), step, autofocus(페이지 들어가자마자 입력가능)
        
        form 요소에 사용할 수 있는 속성
        action, method, autocomplete, novalidate(required, 조건 등을 비활성화)
      -->
    <!---->
    <form
      action="table.html"
      method="get"
      autocomplete="off"
      novalidate
      id="form1"
    >
      <div>
        <label for="tel">전화번호</label>
        <input
          type="tel"
          name="tel"
          id="tel"
          pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}"
          placeholder="010-0000-0000 형식"
          required
          autofocus
        />
      </div>
      <div>
        <!--label for="name">이름</label-->
        <label for="">
          이름
          <input
            type="text"
            name="name"
            id="name"
            size="50"
            pattern="[가-힣]{2,}"
          />
        </label>
        <div>
          <label>
            주소
            <input type="text" name="addr" id="addr" size="50" maxlength="4" />
          </label>
        </div>
      </div>
      <div>
        <input type="radio" name="Fruits1" id="apple" value="사과" />
        <label for="apple">사과</label>
        <input type="radio" name="Fruits1" id="" value="포도" />
        <label for="">포도</label>
        <input type="radio" name="Fruits1" id="" value="키위" />
        <label for="">키위</label>
      </div>
      <div>
        <input type="checkbox" name="Fruits2" id="" value="사과" />
        <label for="">사과</label>
        <input type="checkbox" name="Fruits2" id="" value="포도" />
        <label for="">포도</label>
        <input type="checkbox" name="Fruits2" id="" value="키위" />
        <label for="">키위</label>
      </div>
      <div>
        <div>
          <input type="date" name="" id="" min="2026-07-01" max="2026-07-06" />
        </div>
        <div>
          로컬 타임
          <input type="datetime-local" name="" id="" />
        </div>
        <div>
          이메일
          <input type="email" name="" id="" />
        </div>
        <div>
          파일
          <input type="file" name="" id="" multiple />
        </div>
        <div>
          색깔
          <input type="color" name="" id="" />
        </div>
        <div>
          월
          <input type="month" name="" id="" />
        </div>
        <div>
          number
          <input type="number" name="" id="" min="1" max="30" step="3" />
        </div>
        <div>
          비밀번호
          <input type="password" name="" id="" />
        </div>
        <div>
          서치
          <input type="search" name="" id="" />
        </div>
        <div>
          tel
          <input type="tel" name="" id="" />
        </div>
        <div>
          time
          <input type="time" name="" id="" />
        </div>
        <div>
          url
          <input type="url" name="url" id="" />
        </div>
        <div>
          weeks
          <input type="week" name="" id="" />
        </div>
      </div>
      <div>
        <select name="cars" id="cars" multiple>
          <optgroup label="Swedish Cars">
            <option value="volvo">volvo</option>
            <option value="saab">saap</option>
          </optgroup>
          <optgroup label="German Cars">
            <option value="fiat">fiat</option>
            <option value="audi">audi</option>
          </optgroup>
        </select>
        <div>
          <textarea name="msg" id="" cols="30" rows="10">playing</textarea>
        </div>
      </div>
      <div>
        <input type="submit" value="전송" />
        <input type="reset" value="초기화" />
        <input type="button" value="보내기" />

        <button type="submit">submit</button>
        <button type="reset">reset</button>
        <button type="button">button</button>
      </div>
    </form>
    <fieldset form="form1">
      <legend>Personalia:</legend>
      <label for="fname">First name:</label>
      <input type="text" name="fname" id="fname" form="form1" />
    </fieldset>
  </body>
</html>
